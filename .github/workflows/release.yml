# Releases on every package.json version bump pushed to master.
#
# One-time setup:
#   1. Generate a private key:  openssl genrsa -out gitlab-pierre.pem 2048
#   2. Add it as the EXTENSION_PRIVATE_KEY secret in repo settings
#      (Settings → Secrets and variables → Actions → New repository secret).
#      Paste the full PEM contents, including BEGIN/END lines.
#   3. Keep the .pem file out of git. Losing it means the extension's ID
#      changes and existing installs stop auto-updating.

name: Release

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        if: steps.check.outputs.exists == 'false'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: pnpm build

      - name: Pack .zip
        if: steps.check.outputs.exists == 'false'
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@ff720c809940cd5a1cbb048e988cccc71837ade4 # 1.0.9
        with:
          extensionDir: dist
          zipFilePath: gitlab-pierre-${{ steps.version.outputs.version }}.zip

      - name: Pack .crx
        if: steps.check.outputs.exists == 'false'
        uses: cardinalby/webext-buildtools-chrome-crx-action@200e7173cbdb5acb91d381cf9f7a30080b025047 # 2.0.3
        with:
          zipFilePath: gitlab-pierre-${{ steps.version.outputs.version }}.zip
          crxFilePath: gitlab-pierre-${{ steps.version.outputs.version }}.crx
          privateKey: ${{ secrets.EXTENSION_PRIVATE_KEY }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "gitlab-pierre-$VERSION.crx" \
            "gitlab-pierre-$VERSION.zip"
