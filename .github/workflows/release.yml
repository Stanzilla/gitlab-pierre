# Releases on every package.json version bump pushed to master.
#
# One-time setup:
#   1. Generate a private key:  openssl genrsa -out gitlab-pierre.pem 2048
#   2. Add it as the EXTENSION_PRIVATE_KEY secret in repo settings
#      (Settings → Secrets and variables → Actions → New repository secret).
#      Paste the full PEM contents, including BEGIN/END lines.
#   3. Keep the .pem file out of git. Losing it means the extension's ID
#      changes and existing installs stop auto-updating.
#   4. Add Chrome Web Store API credentials as repository secrets:
#      CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN,
#      CWS_PUBLISHER_ID, and CWS_EXTENSION_ID.

name: Release

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: steps.check.outputs.exists == 'false'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: pnpm build

      - name: Pack .zip
        if: steps.check.outputs.exists == 'false'
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@ff720c809940cd5a1cbb048e988cccc71837ade4 # 1.0.9
        with:
          extensionDir: dist
          zipFilePath: gitlab-pierre-${{ steps.version.outputs.version }}.zip

      - name: Pack .crx
        if: steps.check.outputs.exists == 'false'
        uses: cardinalby/webext-buildtools-chrome-crx-action@200e7173cbdb5acb91d381cf9f7a30080b025047 # 2.0.3
        with:
          zipFilePath: gitlab-pierre-${{ steps.version.outputs.version }}.zip
          crxFilePath: gitlab-pierre-${{ steps.version.outputs.version }}.crx
          privateKey: ${{ secrets.EXTENSION_PRIVATE_KEY }}

      - name: Install cws
        if: steps.check.outputs.exists == 'false'
        env:
          CWS_VERSION: v1.1.1
          CWS_SHA256: a853c6860c712545e472a8199d8f3469cfbbc55a99c04cef573979c54d6a03aa
        run: |
          curl -fsSLO "https://github.com/VaughnBosu/cws-cli/releases/download/$CWS_VERSION/cws_linux_amd64.tar.gz"
          echo "$CWS_SHA256  cws_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf cws_linux_amd64.tar.gz
          install -m 0755 cws "$RUNNER_TEMP/cws"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Publish to Chrome Web Store
        if: steps.check.outputs.exists == 'false'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cws upload "gitlab-pierre-$VERSION.zip" --publish

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "gitlab-pierre-$VERSION.crx" \
            "gitlab-pierre-$VERSION.zip"
